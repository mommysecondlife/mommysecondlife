<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 신청 · 해봤수다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root{--bg:#FFF1F4;--ink:#3A1F2B;--pink:#E8335F;--pink-d:#C81E4A;--line:#FAD9E1;--mut:#8A6B74;--card:#fff;--blush:#FDE8EE;--shadow:0 8px 24px rgba(232,51,95,.10)}
  *{box-sizing:border-box;min-width:0}html,body{margin:0}
  body{background:var(--bg);color:var(--ink);line-height:1.6;word-break:keep-all;font-family:'Pretendard Variable',Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px}
  .top{position:sticky;top:0;z-index:30;background:rgba(255,241,244,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top-in{display:flex;align-items:center;justify-content:space-between;height:56px}
  .top .back{color:var(--mut);font-weight:700;font-size:14px}
  .top .title{font-weight:800;font-size:17px}
  h1{font-size:clamp(22px,5vw,27px);margin:22px 0 4px}
  .lead{color:var(--mut);font-size:14.5px;margin:0 0 18px}
  .btn{border:0;cursor:pointer;font-family:inherit;font-weight:700;border-radius:12px;padding:12px 18px;font-size:15px}
  .btn-pink{background:var(--pink);color:#fff;box-shadow:var(--shadow)}
  .btn-kakao{background:#FEE500;color:#3A1D1D}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .card h3{margin:0 0 4px;font-size:17px}
  .when{color:var(--mut);font-size:14px;margin:0 0 12px}
  .badge{display:inline-block;font-weight:800;font-size:12.5px;padding:5px 11px;border-radius:999px}
  .b-wait{background:#FFF3D6;color:#A9770B}
  .b-ok{background:#D8F3E3;color:#1C8A4E}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .note{font-size:13.5px;color:var(--mut);background:var(--blush);border-radius:12px;padding:11px 13px;margin-top:8px}
  .zoom{display:inline-flex;align-items:center;gap:7px;background:#2D8CFF;color:#fff;font-weight:800;padding:11px 16px;border-radius:12px;margin-top:8px;font-size:14.5px}
  .empty{text-align:center;color:var(--mut);padding:50px 10px}
  .empty .btn{margin-top:16px}
  .sub{font-size:12.5px;color:var(--mut);margin-top:6px}
</style>
</head>
<body>
<header class="top"><div class="wrap top-in">
  <a class="back" href="community.html">← 질문방</a>
  <div class="title">내 신청</div>
  <span style="width:50px"></span>
</div></header>

<main class="wrap">
  <h1>내 라이브 신청</h1>
  <p class="lead">신청 상태와 줌 참여 링크를 여기서 확인해요.</p>
  <div id="list"><div class="empty">불러오는 중…</div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="sudda.js?v=3"></script>
<script>
const $=s=>document.querySelector(s);
function when(s){ if(!s) return ''; const d=new Date(s),p=n=>String(n).padStart(2,'0'),dy=['일','월','화','수','목','금','토'];
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}(${dy[d.getDay()]}) ${p(d.getHours())}:${p(d.getMinutes())}`; }

async function run(){
  const me=await hbsdUser();
  if(!me){
    $('#list').innerHTML=`<div class="empty">로그인하면 신청 내역을 볼 수 있어요.<br>
      <button class="btn btn-kakao" id="lg">카카오 로그인</button></div>`;
    $('#lg').onclick=hbsdLoginKakao; return;
  }
  const { data:regs } = await sb.from('hbsd_registrations').select('*').order('created_at',{ascending:false});
  if(!regs||!regs.length){
    $('#list').innerHTML=`<div class="empty">아직 신청한 라이브가 없어요.<br>
      <a class="btn btn-pink" href="live.html">라이브 보러가기</a></div>`; return;
  }
  const ids=[...new Set(regs.map(r=>r.live_id))];
  const { data:lives } = await sb.from('hbsd_lives_public').select('*').in('id',ids);
  const lmap={}; (lives||[]).forEach(l=>lmap[l.id]=l);

  const cards=[];
  for(const r of regs){
    const l=lmap[r.live_id]||{};
    const ok=r.status==='confirmed';
    let zoneHtml;
    if(ok){
      const { data:zurl } = await sb.rpc('hbsd_zoom_link',{p_live_id:r.live_id});
      zoneHtml = zurl
        ? `<a class="zoom" href="${hbsdEsc(zurl)}" target="_blank" rel="noopener">🎥 줌으로 참여하기</a>`
        : `<div class="note">🎥 줌 링크는 <b>라이브 전날</b>부터 여기에 보여요.</div>`;
    }else{
      let bank=null; try{ const {data}=await sb.rpc('hbsd_bank_for',{p_live_id:r.live_id}); bank=data||null; }catch(e){}
      zoneHtml = `<div class="note">💳 입금 계좌: <b>${bank?hbsdEsc(bank):'관리자 안내 대기'}</b><br>입금이 확인되면 <b>참여 확정</b>으로 바뀌고 줌 링크가 열려요.</div>`;
    }
    cards.push(`<div class="card">
      <div class="row">
        <span class="badge ${ok?'b-ok':'b-wait'}">${ok?'참여 확정 ✅':'입금 대기 ⏳'}</span>
      </div>
      <h3>${hbsdEsc(l.title||'라이브')}</h3>
      <p class="when">${when(l.live_at)}</p>
      <div class="sub">입금자명 ${hbsdEsc(r.depositor_name||'')}</div>
      ${zoneHtml}
    </div>`);
  }
  $('#list').innerHTML=cards.join('');
}
run();
</script>
</body>
</html>
