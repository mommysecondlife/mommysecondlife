<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해봤수다 라이브 · 엄세라</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="eomsera_logo_round.png">
<meta name="description" content="먼저 해본 엄마들과 함께하는 90분 라이브. 신청하고 함께해요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root{--bg:#FFF1F4;--ink:#3A1F2B;--pink:#E8335F;--pink-d:#C81E4A;--line:#FAD9E1;--mut:#8A6B74;--card:#fff;--blush:#FDE8EE;--shadow:0 8px 24px rgba(232,51,95,.10)}
  *{box-sizing:border-box;min-width:0}html,body{margin:0}
  body{background:var(--bg);color:var(--ink);line-height:1.6;word-break:keep-all;font-family:'Pretendard Variable',Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased;padding-top:0}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1040px;margin:0 auto;padding:0 24px}
  @media(min-width:1088px){.wrap{padding-left:0;padding-right:0}}
  h1,h2,h3{letter-spacing:-.02em}

  /* nav (메인과 통일) */
  .news-bar{display:flex;align-items:center;justify-content:center;gap:7px;position:fixed;top:0;left:0;right:0;z-index:55;min-height:44px;padding:8px 16px;box-sizing:border-box;background:var(--pink);color:#fff;font-size:14.5px;font-weight:800;letter-spacing:-.01em;text-decoration:none;text-align:center;word-break:keep-all}
  .news-bar .nb-arrow{font-weight:800}
  @media(max-width:640px){.news-bar{font-size:12.5px}.news-bar .nb-full{display:none}}
  nav#nav{position:fixed;top:44px;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 32px;background:rgba(255,241,244,.9);backdrop-filter:blur(12px);box-shadow:0 1px 0 var(--line)}
  nav#nav .brand{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:22px;color:var(--ink);text-decoration:none}
  nav#nav .brand img{width:32px;height:32px;border-radius:50%;object-fit:cover}
  .nav-right-group{display:flex;align-items:center;gap:24px}
  .nav-side{display:flex;gap:28px;align-items:center}
  .nav-side a{font-size:17px;font-weight:600;color:var(--ink);text-decoration:none;position:relative}
  .nav-side a::after{content:"";position:absolute;left:0;right:100%;bottom:-6px;height:3px;background:var(--pink);border-radius:2px;transition:right .25s cubic-bezier(.22,1,.36,1)}
  .nav-side a:hover{color:var(--pink)}
  .nav-side a:hover::after,.nav-side a.active::after{right:0}
  .nav-side a.active{color:var(--pink)}
  .nav-toggle{display:none;flex-direction:column;justify-content:center;gap:5px;width:44px;height:40px;padding:8px;background:none;border:0;cursor:pointer;z-index:60}
  .nav-toggle span{display:block;width:24px;height:2.5px;background:var(--ink);border-radius:2px;transition:transform .25s,opacity .2s}
  nav#nav.open .nav-toggle span:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
  nav#nav.open .nav-toggle span:nth-child(2){opacity:0}
  nav#nav.open .nav-toggle span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
  @media(max-width:860px){
    nav#nav{padding:12px 20px}
    .nav-toggle{display:flex}
    .nav-side{display:none;position:absolute;top:calc(100% + 6px);right:16px;flex-direction:column;align-items:stretch;gap:2px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px rgba(232,51,95,.16);padding:8px;min-width:190px}
    nav#nav.open .nav-side{display:flex}
    .nav-side a{padding:12px 16px;border-radius:10px;font-size:16px}
    .nav-side a::after{display:none}
    .nav-side a:hover{background:var(--blush)}
  }

  .page-head{padding:130px 24px 20px;text-align:center}
  .page-head h1{font-size:clamp(32px,5vw,52px);font-weight:800;letter-spacing:-.03em;margin:0 0 12px}
  .page-head p{color:var(--mut);font-size:16px;max-width:560px;margin:0 auto}

  .content{max-width:620px;margin:0 auto;padding:10px 0 80px}
  /* live card */
  .live{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:var(--shadow)}
  .live .badge{display:inline-block;background:var(--blush);color:var(--pink-d);font-weight:800;font-size:12.5px;padding:5px 12px;border-radius:999px;margin-bottom:14px}
  .live h2{font-size:22px;margin:0 0 18px}
  .info{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:22px}
  .info .row{display:flex;gap:12px;background:#fff;padding:13px 16px;font-size:15px}
  .info .row .k{color:var(--mut);font-weight:700;width:84px;flex:0 0 auto}
  .info .row .v{font-weight:600}
  .lockline{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:13.5px;background:var(--blush);border-radius:12px;padding:11px 14px;margin-bottom:22px}
  .btn{border:0;cursor:pointer;font-family:inherit;font-weight:800;border-radius:14px;font-size:16px;transition:transform .12s,background .15s}
  .btn:active{transform:scale(.99)}
  .btn-pink{background:var(--pink);color:#fff;box-shadow:var(--shadow);width:100%;padding:16px}
  .btn-pink:hover{background:var(--pink-d)}
  .btn-kakao{background:#FEE500;color:#3A1D1D;width:100%;padding:16px}
  .status{text-align:center;padding:16px;border-radius:16px;font-weight:800;font-size:15px}
  .st-wait{background:#FFF3D6;color:#A9770B}
  .st-ok{background:#D8F3E3;color:#1C8A4E}
  .muted{color:var(--mut);font-size:14px;text-align:center;margin-top:12px}
  .muted a{color:var(--pink);font-weight:700}
  .empty{text-align:center;color:var(--mut);padding:40px 10px}

  /* form sheet */
  .scrim{position:fixed;inset:0;background:rgba(58,31,43,.5);z-index:120;display:none}
  .scrim.on{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:121;background:var(--card);border-radius:22px 22px 0 0;max-width:620px;margin:0 auto;max-height:92vh;overflow-y:auto;padding:22px 18px 34px;transform:translateY(100%);transition:transform .28s}
  .sheet.on{transform:none}
  .sheet h3{margin:0 0 4px;font-size:20px}
  .sheet .sub{color:var(--mut);font-size:14px;margin:0 0 8px}
  .sheet .x{position:absolute;right:14px;top:14px;width:40px;height:40px;border:0;background:var(--blush);border-radius:50%;font-size:20px;cursor:pointer;color:var(--ink)}
  label.fld{display:block;font-weight:700;font-size:14px;margin:16px 0 6px}
  label.fld .opt{color:var(--mut);font-weight:500}
  .inp,.ta{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;font-family:inherit;font-size:15px;background:#fff;color:var(--ink)}
  .ta{min-height:80px;resize:vertical}
  .inp:focus,.ta:focus{outline:none;border-color:var(--pink)}
  .radio{display:flex;gap:8px;flex-wrap:wrap}
  .radio button{flex:1 1 auto;border:1.5px solid var(--line);background:#fff;color:var(--mut);border-radius:12px;padding:11px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
  .radio button.on{background:var(--blush);border-color:var(--pink);color:var(--pink-d)}
  .foot{margin-top:22px}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);z-index:160;background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<a class="news-bar" href="https://page.stibee.com/subscriptions/518741" target="_blank" rel="noopener">🗞️ <span class="nb-full">엄마의 세컨드 라이프 · </span>무료 뉴스레터 구독하기 <span class="nb-arrow">›</span></a>
<nav id="nav">
  <a class="brand" href="index.html"><img src="eomsera_logo_round.png" alt="엄세라 로고">엄세라</a>
  <div class="nav-right-group">
    <div class="nav-side">
      <a href="story.html">Story</a>
      <a href="ailab.html">AI LAB</a>
      <a href="community.html" class="active">Community</a>
    </div>
    <div class="nav-account" data-account></div>
    <button class="nav-toggle" id="navToggle" aria-label="메뉴" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
</nav>

<main id="top">
  <section class="page-head">
    <h1>해봤수다 모임 <span style="color:var(--mut);font-weight:700;font-size:.55em">(온라인 줌)</span></h1>
    <p>먼저 해본 엄마가 줌으로 풀어놓는 시간. 얼굴 공개 없이 편하게 들어요.</p>
  </section>
  <div class="content" id="content"><div class="empty">불러오는 중…</div></div>
</main>

<!-- 신청서 -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <button class="x" id="closeBtn">×</button>
  <h3>라이브 신청</h3>
  <p class="sub">아래를 적어주시면 신청이 접수돼요. 입금 확인 후 참여가 확정돼요.</p>
  <label class="fld">입금자명</label>
  <input class="inp" id="f_name" placeholder="입금하실 이름">
  <label class="fld">연락처 <span class="opt">· 카카오 ID 또는 휴대폰</span></label>
  <input class="inp" id="f_contact" placeholder="예: 카카오 ID eomsera / 010-0000-0000">
  <label class="fld">아이 나이 <span class="opt">· 선택</span></label>
  <input class="inp" id="f_child" placeholder="예: 5살, 7살">
  <label class="fld">요즘 가장 고민인 것</label>
  <textarea class="ta" id="f_concern" placeholder="편하게 적어주세요"></textarea>
  <label class="fld">꼭 얻어가고 싶은 것</label>
  <textarea class="ta" id="f_goal" placeholder="이 라이브에서 가져가고 싶은 것"></textarea>
  <label class="fld">언젠가 발표해보고 싶은가요?</label>
  <div class="radio" id="f_intent">
    <button type="button" data-v="yes">예, 해보고 싶어요</button>
    <button type="button" data-v="not_yet">아직은요</button>
    <button type="button" data-v="unsure">모르겠어요</button>
  </div>
  <div class="foot"><button class="btn btn-pink" id="submitBtn">신청하기</button></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="sudda.js?v=4"></script>
<script src="umsera-auth.js?v=1"></script>
<script>
const $=s=>document.querySelector(s);
let LIVE=null, ME=null, MYREG=null, INTENT='', MYBANK=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000);}
function won(n){return n==null?'':Number(n).toLocaleString('ko-KR')+'원';}
function whenK(s){if(!s)return'미정';const d=new Date(s),p=n=>String(n).padStart(2,'0'),dy=['일','월','화','수','목','금','토'];
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}(${dy[d.getDay()]}) ${p(d.getHours())}:${p(d.getMinutes())}`;}

async function run(){
  await UAUTH.ready; ME=UAUTH.user;
  const { data:lives } = await sb.from('hbsd_lives_public').select('*').order('live_at',{ascending:true});
  LIVE=(lives||[]).find(l=>!l.live_at || new Date(l.live_at)>=new Date(Date.now()-864e5)) || (lives||[])[0];
  if(!LIVE){ $('#content').innerHTML='<div class="empty">🎤 라이브를 준비하고 있어요.<br>열리면 여기서 가장 먼저 알려드릴게요!</div>'; return; }
  if(ME){ const { data:reg } = await sb.from('hbsd_registrations').select('*').eq('live_id',LIVE.id).maybeSingle(); MYREG=reg||null;
    if(MYREG){ try{ const { data:bk }=await sb.rpc('hbsd_bank_for',{p_live_id:LIVE.id}); MYBANK=bk||null; }catch(e){} } }
  render();
}

function render(){
  const l=LIVE;
  let cta;
  if(!ME){
    cta=`<button class="btn btn-kakao" id="loginBtn">카카오 로그인하고 신청하기</button>`;
  }else if(MYREG){
    const ok=MYREG.status==='confirmed';
    cta=`<div class="status ${ok?'st-ok':'st-wait'}">${ok?'참여 확정 ✅':'입금 대기 중 ⏳'}</div>
      ${(!ok&&MYBANK)?`<div class="lockline" style="margin-top:10px">💳 입금 계좌: <b>${hbsdEsc(MYBANK)}</b>${LIVE.price!=null?` · ${won(LIVE.price)}`:''}</div>`:''}
      <p class="muted">${ok?'줌 링크는 모임 전날부터 ':'입금이 확인되면 참여 확정돼요. '}<a href="my.html">내 신청</a>에서도 볼 수 있어요.</p>`;
  }else{
    cta=`<button class="btn btn-pink" id="applyBtn">신청하기</button>`;
  }
  $('#content').innerHTML=`
    <div class="live">
      <span class="badge">💻 해봤수다 모임</span>
      <h2>${hbsdEsc(l.title||'라이브')}</h2>
      <div class="info">
        <div class="row"><span class="k">일시</span><span class="v">${whenK(l.live_at)}${l.duration_min?` · ${l.duration_min}분`:''}</span></div>
        <div class="row"><span class="k">발표자</span><span class="v">${hbsdEsc(l.speaker||'미정')}</span></div>
        <div class="row"><span class="k">참가비</span><span class="v">${l.price!=null?won(l.price):'안내 예정'}</span></div>
        <div class="row"><span class="k">입금 계좌</span><span class="v">🔒 신청하면 안내해드려요</span></div>
        <div class="row"><span class="k">입금 마감</span><span class="v">${l.deposit_deadline?whenK(l.deposit_deadline):'안내 예정'}</span></div>
      </div>
      <div class="lockline">🔒 줌 링크는 참여 확정된 분께 <b>모임 전날부터</b> 공개돼요.</div>
      ${cta}
    </div>`;
  if($('#loginBtn'))$('#loginBtn').onclick=hbsdLoginKakao;
  if($('#applyBtn'))$('#applyBtn').onclick=openForm;
}

function openForm(){
  INTENT=''; $('#f_intent').querySelectorAll('button').forEach(b=>b.classList.remove('on'));
  $('#scrim').classList.add('on'); $('#sheet').classList.add('on'); document.body.style.overflow='hidden';
}
function closeForm(){ $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); document.body.style.overflow=''; }

$('#f_intent').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  $('#f_intent').querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); INTENT=b.dataset.v;
});
$('#closeBtn').onclick=closeForm; $('#scrim').onclick=closeForm;
$('#submitBtn').onclick=async()=>{
  const name=$('#f_name').value.trim(), contact=$('#f_contact').value.trim();
  if(!name){toast('입금자명을 적어주세요');return;}
  if(!contact){toast('연락처를 적어주세요');return;}
  const payload={live_id:LIVE.id,user_id:ME.id,depositor_name:name,contact,
    child_age:$('#f_child').value.trim()||null,concern:$('#f_concern').value.trim()||null,
    goal:$('#f_goal').value.trim()||null,present_intent:INTENT||null};
  const { error }=await sb.from('hbsd_registrations').insert(payload);
  if(error){ toast('오류: '+error.message); return; }
  closeForm(); MYREG={...payload,status:'pending'};
  try{ const { data:bk }=await sb.rpc('hbsd_bank_for',{p_live_id:LIVE.id}); MYBANK=bk||null; }catch(e){}
  render();
  toast('신청 접수됐어요! 계좌로 입금해 주세요 💛');
};

// 햄버거
(function(){var n=document.getElementById('nav'),t=document.getElementById('navToggle');
  if(n&&t){t.addEventListener('click',function(e){e.stopPropagation();var o=n.classList.toggle('open');t.setAttribute('aria-expanded',o);});
  n.querySelectorAll('.nav-side a').forEach(function(a){a.addEventListener('click',function(){n.classList.remove('open');});});
  document.addEventListener('click',function(e){if(!e.target.closest('#nav'))n.classList.remove('open');});}
})();
run();
</script>
</body>
</html>
